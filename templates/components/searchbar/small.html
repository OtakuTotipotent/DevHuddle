<form action="{% url 'search' %}" method="get" class="relative">

         placeholder="Search..."
         class="w-full bg-gray-900 text-gray-400 border border-gray-700/60 rounded-full py-2 pr-2 pl-11 text-sm focus:outline-none focus:border-blue-500/50 transition"
         autocomplete="off"
         required />
  <div class="absolute left-4 top-3 text-blue-500">

      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z">
      </path>
    </svg>
