{% extends "base.html" %}
{% block title %}
    Delete Experience
{% endblock title %}
{% block content %}
    <div class="max-w-md mx-auto mt-20">
        <div class="bg-gray-800 p-8 rounded-lg shadow-lg border border-red-900/50 text-center">
            <div class="w-16 h-16 bg-red-900/30 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4 pb-2 text-3xl">
                ⚠️
            </div>
            <h2 class="text-2xl font-bold text-white">Delete Experience Record?</h2>
            <p class="text-gray-400 text-sm mt-2 mb-6">
                Are you sure you want to permanently remove your time at <strong class="text-white">{{ object.company }}</strong>?
            </p>
            <form method="post">
                {% csrf_token %}
                <div class="flex flex-col gap-3">
                    <button type="submit"
                            class="w-full bg-red-700 hover:bg-red-500 text-white font-semibold py-3 rounded-full transition cursor-pointer">
                        Yes, Delete Record
                    </button>
                    <a href="{% url 'user_profile' user.username %}"
                       class="w-full border border-gray-600 text-gray-400 hover:text-white hover:bg-gray-900 font-bold py-3 rounded-full transition leading-tight">Cancel</a>
                </div>
            </form>
        </div>
    </div>
{% endblock content %}
