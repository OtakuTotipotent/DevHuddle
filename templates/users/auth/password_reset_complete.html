{% extends "base.html" %}
{% block title %}Password Reset Complete{% endblock title %}
{% block content %}
    <div class="max-w-md mx-auto mt-20 text-center">
        <div class="bg-gray-800 p-8 rounded-2xl shadow-2xl border border-green-500/30">
            <div class="text-5xl mb-4 text-green-500">✅</div>
            <h2 class="text-2xl font-bold mb-2 text-white">Password Updated!</h2>
            <p class="text-gray-400 text-sm mb-6">Your password has been set securely. You may now log in to your account.</p>
            <a href="{% url 'login' %}"
               class="w-full inline-block bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition shadow-lg">Log in to DevHuddle</a>
        </div>
    </div>
{% endblock content %}
