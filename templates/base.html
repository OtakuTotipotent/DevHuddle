{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
          content="DevHuddle is a developer community platform for sharing ideas, networking, and collaborating on projects." />
    <meta name="keywords"
          content="developer community, coding, collaboration, networking, DevHuddle" />
    <title>
      DevHuddle |
      {% block title %}
        Connect
      {% endblock title %}
    </title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}" />
  </head>
  <body class="bg-gray-900 text-gray-300 font-sans antialiased h-screen overflow-hidden">
    <nav class="md:h-[6%] h-[6%] border-b border-gray-700 flex items-center justify-center">
      {% include "sections/navbar.html" %}
    </nav>
    <main class="md:h-[90%] h-[88%] container mx-auto overflow-auto">
      {% block content %}
      {% endblock content %}
    </main>
    <footer class="md:h-[4%] h-[6%] border-t border-gray-700 grid place-content-center">
      {% include "sections/footer.html" %}
    </footer>
    <script src="{% static 'js/menu_toggle.js' %}"></script>
    {% block scripts %}
    {% endblock scripts %}
  </body>
</html>
