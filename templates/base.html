{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
          content="DevHuddle is a developer community platform for sharing ideas, networking, and collaborating on projects." />
    <meta name="keywords"
          content="developer community, coding, collaboration, networking, DevHuddle" />
    <title>
      DevHuddle |
      {% block title %}
        Connect
      {% endblock title %}
    </title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}" />
  </head>
  <body class="bg-gray-900 text-gray-100 font-sans antialiased overflow-x-hidden">
    {% include "sections/navbar.html" %}
    <main class="container mx-auto p-3 min-h-[80vh]">
      {% block content %}
      {% endblock content %}
    </main>
    {% include "sections/footer.html" %}
    <script src="{% static 'js/menu_toggle.js' %}"></script>
    {% block scripts %}
    {% endblock scripts %}
  </body>
</html>
