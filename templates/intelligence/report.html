{% extends "base.html" %}
{% block title %}
    AI Analysis
{% endblock title %}
{% block content %}
    <div class="max-w-3xl mx-auto mt-10">
        <div class="bg-gray-900 border-2 border-purple-500/50 rounded-2xl p-8 shadow-2xl shadow-purple-900/20 relative overflow-hidden">
            <div class="absolute top-0 right-0 w-64 h-64 bg-purple-600/10 rounded-full blur-3xl pointer-events-none"></div>
            <div class="flex items-center gap-4 border-b border-gray-700 pb-6 mb-6">
                <div class="w-14 h-14 bg-purple-900/50 text-purple-400 rounded-2xl flex items-center justify-center text-3xl border border-purple-500/50">
                    🤖
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-white">DevHuddle AI Intelligence</h1>
                    <p class="text-gray-400 text-sm">
                        Target: <span class="text-purple-400 font-mono">{{ report.get_report_type_display }}</span>
                    </p>
                </div>
            </div>
            <div class="prose prose-invert prose-purple max-w-none">{{ report.content|linebreaks|safe }}</div>
            <div class="mt-8 pt-6 border-t border-gray-700 text-right">
                <a href="{% url 'home' %}"
                   onclick="history.back(); return false;"
                   class="text-gray-400 hover:text-white text-sm font-bold transition">← Return</a>
            </div>
        </div>
    </div>
{% endblock content %}
